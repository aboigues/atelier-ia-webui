# Outils de la chaîne de contrôle, figés par version ET empreinte (constitution, principes V et VII).
# Images : outils dont l'image officielle n'a aucune vulnérabilité critique ou élevée.
# Binaires : outils dont l'image officielle en avait (paquets système non mis à jour) ; on prend
# alors le binaire officiel de la release, vérifié par sa somme SHA-256 (décision d'Alexandre du
# 2026-11-26). Tous, images et binaires, sont analysés par Grype à chaque contrôle « sca ».
# Source unique lue par les workflows (.github/workflows/) et par le contrôle local
# (outils/securite/controles-locaux.sh). Format : nom=image:version@sha256:<64 hex>, ou, pour un
# binaire téléchargé, nom=URL#sha256=<64 hex>.
# Versions relevées le 2026-11-26 (pages de releases), empreintes résolues avec
# `docker buildx imagetools inspect`. Toute mise à jour : relever à nouveau version et empreinte.

ruff=ghcr.io/astral-sh/ruff:0.17.6@sha256:2671e9bf3e50c24a88e731f209f9bf01c0360da6857ae36bca680b222efc3528
