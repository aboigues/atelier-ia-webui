# Exceptions de sécurité datées (constitution, principe VII ; specs/002-chaine-controle-securite,
# FR-007 et FR-008 ; format : contracts/exceptions.md). Toute modification passe par une PR.
# Une exception échue (après reexamen_le) cesse de s'appliquer : le contrôle redevient bloquant.

# Exception de classe exigée par FR-007 (choix d'Alexandre du 2026-11-26, question Q1) :
# vulnérabilités élevées sans correctif publié, listées dans le rapport sans bloquer.
[[exception]]
id = "elevee-sans-correctif"
type = "classe"
portee = "*"
raison = "Images tierces (Open WebUI, Caddy, outils) : paquets système sans correctif publié ; suivi hebdomadaire."
acceptee_par = "Alexandre"
acceptee_le = 2026-11-26
reexamen_le = 2027-02-24

# Trivy v0.76.2 (dernière version) : plantage sur données zstd malformées dans
# github.com/klauspost/compress 1.20.1 (corrigé en 1.20.2). Trivy n'analyse que les fichiers
# IaC du dépôt ; le pire cas est un plantage qui fait échouer le contrôle (fermé en cas d'échec).
# Acceptée par Alexandre le 2026-11-26 ; à lever dès qu'une version de Trivy corrige la faille.
[[exception]]
id = "GO-2026-6865"
type = "vulnerabilite"
portee = "binaire:trivy"
raison = "Plantage seulement (déni de service local), Trivy limité à l'analyse des fichiers IaC du dépôt."
acceptee_par = "Alexandre"
acceptee_le = 2026-11-26
reexamen_le = 2027-02-24

